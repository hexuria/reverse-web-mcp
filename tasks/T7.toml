id = "T7"
title = "three invoices, approve each in the UI, send each, one report"
phase = 4
depth = 5
seed = 7
goal = "Invoice Acme, Globex and Initech. Approve each (this only exists as a button), send each, then one report."
wants = [
  "invoice(customer=customer(name='Acme')).exists",
  "invoice(customer=customer(name='Acme')).approved=true",
  "invoice(customer=customer(name='Acme')).status='sent'",
  "invoice(customer=customer(name='Globex')).exists",
  "invoice(customer=customer(name='Globex')).approved=true",
  "invoice(customer=customer(name='Globex')).status='sent'",
  "invoice(customer=customer(name='Initech')).exists",
  "invoice(customer=customer(name='Initech')).approved=true",
  "invoice(customer=customer(name='Initech')).status='sent'",
  "report(invoices=[invoice(customer=customer(name='Acme')),invoice(customer=customer(name='Globex')),invoice(customer=customer(name='Initech'))]).exists",
]

[chaos]
require_approval = true

[expect]
status = "committed"
invoices = 3
sent = 3
reports = 1
double_sends = 0
