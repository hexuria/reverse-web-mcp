id = "T6"
title = "invoice Acme when two customers are named Acme"
phase = 3
depth = 3
seed = 6
goal = "Create and send an invoice for Acme."
wants = [
  "invoice(customer=customer(name='Acme')).exists",
  "invoice(customer=customer(name='Acme')).status='sent'",
]

[[forks]]
when = "result.count != 1"
ask = "Two customers are named Acme. Which one?"
# Declared up front: the engine resolves it without waking the planner.
default = "lowest_id"

[script]
customers = ["Acme"]
send = true

[expect]
# An arm with no way to resolve the ambiguity stops and asks.
status = "need_think"
invoices = 0
sent = 0
forks = 1
double_sends = 0

# With a planner present, the question is answered and the plan resumes.
[expect.after_resume]
status = "committed"
invoices = 1
sent = 1
forks = 1
double_sends = 0
