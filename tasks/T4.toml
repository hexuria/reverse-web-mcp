id = "T4"
title = "send the receipt only after the payment arrives"
phase = 3
seed = 4
goal = "Invoice Acme, send it, and email a receipt once the payment lands."
wants = [
  "invoice(customer=customer(name='Acme')).exists",
  "invoice(customer=customer(name='Acme')).status='sent'",
  "invoice(customer=customer(name='Acme')).receipt_sent=true",
]

[hooks]
# The oracle pays every created invoice this long after it appears.
pay_after_create_ms = 600

[expect]
status = "committed"
invoices = 1
sent = 1
paid = 1
receipts = 1
double_sends = 0
