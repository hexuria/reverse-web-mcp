# The sandbox. Your machine runs `docker compose up`; everything else happens in here.
services:
  app:
    build: { context: .., dockerfile: docker/Dockerfile }
    entrypoint: ["/usr/local/bin/app", "--bind", "0.0.0.0:47310", "--seed", "1"]
    ports: ["47310:47310"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:47310/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  bench:
    build: { context: .., dockerfile: docker/Dockerfile }
    depends_on:
      app: { condition: service_healthy }
    environment:
      APP_URL: http://app:47310
      ARMS: ${ARMS:-D,E}
      RUNS: ${RUNS:-5}
      PHASE: ${PHASE:-3}
      PLANNER: ${PLANNER:-}
      MODEL: ${MODEL:-}
      # A gateway on the host, e.g. opencodex: http://host.docker.internal:8080
      BASE_URL: ${BASE_URL:-}
      OUT: ${OUT:-sandbox}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../results:/work/results
    shm_size: 1g
